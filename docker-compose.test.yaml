services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env.internal
    environment:
      USE_REDIS: "true"
      REDIS_HOST_NAME: redis
      REDIS_AUTH_TOKEN: ""
    ports:
      - "3000:3000"
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
