name: Mocha Unit tests
on:
  workflow_dispatch: # Allow manual triggering only
  workflow_call: # Allow this workflow to be called by other workflows

# This is a standard set of permissions we found to be sufficient for most workflows in general
# We set these to narrow permissions as advised by https://codeql.github.com/codeql-query-help/actions/actions-missing-workflow-permissions/
# If you want to be more restrictive, you can try changing these permissions here, or assigning permissions per job in a workflow file
permissions:
  contents: read
  actions: read
  packages: read

jobs:
  mocha-unit-tests:
    name: Mocha Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98

      - name: Setup Node and Dependencies
        uses: ./.github/actions/setup-node

      - name: Run Mocha unit tests
        run: yarn test:unit
        env:
          CI: true
          # Add session-related environment variables for unit tests
          SESSION_SECRET: "mocha-test-secret" # Use a simple test secret for Mocha unit tests
          SESSION_NAME: "sessionId"
