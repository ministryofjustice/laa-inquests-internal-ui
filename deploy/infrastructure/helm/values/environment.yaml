replicaCount: 2

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false
  name: "cd-serviceaccount"

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: modsec-non-prod
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  annotations:
    external-dns.alpha.kubernetes.io/set-identifier: ""
    external-dns.alpha.kubernetes.io/aws-weight: "100"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
    nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
    nginx.ingress.kubernetes.io/modsecurity-snippet: |
      SecRuleEngine On
      SecDefaultAction "phase:2,pass,log,tag:github_team=laa-inquests"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  AWS_SECRETS_INQUESTS_API_ENTRA_CONFIG: ""
  AWS_SECRETS_AUTH_CLIENT_ID: ""
  AWS_SECRETS_AUTH_CLIENT_SECRET: ""
  AWS_SECRETS_AUTH_DIRECTORY_URL: ""
  AWS_SECRETS_REDIS_SECRET: ""
  AUTH_POST_LOGOUT_URI: ""
  AUTH_REDIRECT_URI: ""
  SERVICE_NAME: "Inquests"
  SERVICE_PHASE: "Beta"
  DEPARTMENT_NAME: "Legal Aid Agency"
  DEPARTMENT_URL: "https://www.gov.uk/government/organisations/legal-aid-agency"
  CONTACT_EMAIL: "eligibility@justice.gov.uk"
  CONTACT_PHONE: ""
  INQUESTS_API_URL: ""
  SERVICE_URL: "https://www.gov.uk/legal-aid"
  SESSION_NAME: "sessionId"
  RATE_LIMIT_GLOBAL_MAX: 6000
  RATE_LIMIT_IP_MAX: 900
  RATE_WINDOW_MS: 900000
  RATE_WINDOW_PER_REPORT_MS: 5000
  NODE_ENV: "production"

livenessProbe:
  httpGet:
    path: /status
    port: http
  initialDelaySeconds: 30
  periodSeconds: 60

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 60

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}